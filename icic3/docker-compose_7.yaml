name: dxcore

networks:
  qnmesh:
    name: qnmesh
    driver: bridge

volumes:
  rand_imgproc_data:
    name: rand_imgproc_data
  corpus_data:
    name: corpus_data

services:

  logmon:
    image: amir20/dozzle:v10
    container_name: logmon
    restart: unless-stopped
    networks:
      - qnmesh
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ─────────────────────────────────────────────
  # Food-101 image loader
  # 20 categories x 1 image = 20 large images
  # Uses public dataset[idx] API — no private attributes
  # Saved to rand_imgproc_data volume
  # ─────────────────────────────────────────────
  img_loader:
    image: python:3.14-slim-bookworm
    container_name: img_loader
    networks:
      - qnmesh
    volumes:
      - rand_imgproc_data:/data/images
    restart: "no"
    command:
      - bash
      - -c
      - |
        pip install torch torchvision pillow --quiet --index-url https://download.pytorch.org/whl/cpu
        python - <<'EOF'
        import os
        import torchvision.datasets as datasets
        from PIL import Image

        SAVE_DIR = "/data/images"
        os.makedirs(SAVE_DIR, exist_ok=True)

        # Food-101 uses these exact underscore names internally
        SELECTED_CATEGORIES = [
            "burger",
            "pizza",
            "sushi",
            "steak",
            "ice_cream",
            "ramen",
            "tacos",
            "waffles",
            "donuts",
            "hot_dog",
            "french_fries",
            "fried_rice",
            "grilled_salmon",
            "chocolate_cake",
            "caesar_salad",
            "chicken_wings",
            "clam_chowder",
            "dumplings",
            "eggs_benedict",
            "pancakes",
        ]

        print("[INFO] Downloading Food-101 dataset...")
        dataset = datasets.Food101(root="/tmp/food101", split="train", download=True)
        print(f"[INFO] Dataset loaded — {len(dataset)} total images available")

        # Public API: dataset.classes is the list of category name strings
        available_classes = dataset.classes
        print(f"[INFO] Available categories: {len(available_classes)}")

        # Validate all selected categories exist in the dataset
        missing = [c for c in SELECTED_CATEGORIES if c not in available_classes]
        if missing:
            print(f"[WARN] These categories not found in Food-101, will be skipped: {missing}")

        # Map category name -> integer label index
        class_to_idx = {c: i for i, c in enumerate(available_classes)}
        idx_to_class = {i: c for i, c in enumerate(available_classes)}

        # Only keep categories that actually exist
        valid_categories  = [c for c in SELECTED_CATEGORIES if c in class_to_idx]
        selected_idx_set  = {class_to_idx[c] for c in valid_categories}

        # collected[category_name] = False until one image is saved
        collected = {c: False for c in valid_categories}
        saved     = 0
        total     = len(valid_categories)

        # Iterate using public dataset[idx] — returns (PIL.Image, int label)
        for idx in range(len(dataset)):
            img, label_idx = dataset[idx]

            if label_idx not in selected_idx_set:
                continue

            label_name = idx_to_class[label_idx]

            if collected[label_name]:
                continue  # already saved one for this category

            fname = f"{SAVE_DIR}/{label_name}.jpg"
            img.convert("RGB").save(fname, "JPEG", quality=95)

            collected[label_name] = True
            saved += 1
            w, h = img.size
            print(f"[{saved:02d}/{total}] saved {fname}  {w}x{h}")

            if all(collected.values()):
                break  # all categories filled — stop early

        print("=" * 60)
        print(f"Done. {saved}/{total} images saved to {SAVE_DIR}")

        # Report any categories that had no images found
        not_saved = [c for c, done in collected.items() if not done]
        if not_saved:
            print(f"[WARN] No image found for: {not_saved}")
        print("=" * 60)
        EOF

  # ─────────────────────────────────────────────
  # AG News text corpus loader
  # 4 categories x 10,000 records = 40,000 total
  # AG News HuggingFace text field format:
  #   "Title text - Description sentence one. Sentence two."
  # Split on first " - " to get title and description
  # Saved to corpus_data volume
  # ─────────────────────────────────────────────
  text_loader:
    image: python:3.14-slim-bookworm
    container_name: text_loader
    networks:
      - qnmesh
    volumes:
      - corpus_data:/data/corpus
    restart: "no"
    command:
      - bash
      - -c
      - |
        pip install datasets --quiet
        python - <<'EOF'
        import os, json
        from datasets import load_dataset

        SAVE_DIR    = "/data/corpus"
        MAX_PER_CAT = 10000

        os.makedirs(SAVE_DIR, exist_ok=True)

        # AG News label mapping
        # 0 = World, 1 = Sports, 2 = Business, 3 = Sci/Tech
        CATEGORY_MAP = {
            0: "world",
            1: "sports",
            2: "business",
            3: "technology",
        }

        def split_title_description(raw: str):
            """
            AG News HuggingFace text field format:
              "Some Title Here - First sentence of description. More text."
            Split on first ' - ' to separate title from description.
            Fall back to full text as description if separator not found.
            """
            raw = raw.strip()
            sep = " - "
            idx = raw.find(sep)
            if idx != -1:
                title       = raw[:idx].strip()
                description = raw[idx + len(sep):].strip()
            else:
                # No separator — use full text as description, empty title
                title       = ""
                description = raw
            return title, description

        print("[INFO] Loading AG News dataset...")
        dataset = load_dataset("ag_news", split="train")
        print(f"[INFO] Dataset loaded — {len(dataset)} total records")

        corpus = {cat: [] for cat in CATEGORY_MAP.values()}

        for row in dataset:
            label    = row["label"]
            category = CATEGORY_MAP.get(label)
            if category is None:
                continue
            if len(corpus[category]) >= MAX_PER_CAT:
                continue

            title, description = split_title_description(row["text"])

            corpus[category].append({
                "title":       title,
                "description": description,
            })

            # Stop early once all categories are full
            if all(len(v) >= MAX_PER_CAT for v in corpus.values()):
                break

        # Save one JSON array file per category
        total = 0
        for category, records in corpus.items():
            fpath = f"{SAVE_DIR}/{category}.json"
            with open(fpath, "w", encoding="utf-8") as f:
                json.dump(records, f, ensure_ascii=False, indent=2)
            total += len(records)
            print(f"[INFO] {category:12s} → {len(records):6d} records → {fpath}")

            # Print first record as sanity check
            if records:
                sample = records[0]
                print(f"       sample title : {sample['title'][:60]}")
                print(f"       sample desc  : {sample['description'][:60]}")

        print("=" * 60)
        print(f"Done. {total} total records saved to {SAVE_DIR}")
        print("=" * 60)
        EOF
