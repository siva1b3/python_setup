name: dxcore

networks:
  qnmesh:
    name: qnmesh
    driver: bridge

volumes:
  imgproc_data_1:
    name: imgproc_data_1
  corpus_data:
    name: corpus_data

services:

  # ─────────────────────────────────────────────
  # Image loader
  # 20 food categories, 1 image each
  # Direct Wikimedia Commons URLs — no API key, no archive
  # Saved to imgproc_data_1 volume
  # ─────────────────────────────────────────────
  img_loader:
    image: python:3.14-slim-bookworm
    container_name: img_loader
    networks:
      - qnmesh
    volumes:
      - imgproc_data_1:/data/images
    restart: "no"
    command:
      - bash
      - -c
      - |
        pip install pillow requests --quiet
        python - <<'EOF'
        import os, time
        import requests
        from PIL import Image
        from io import BytesIO

        SAVE_DIR = "/data/images"
        os.makedirs(SAVE_DIR, exist_ok=True)

        # Direct Wikimedia Commons URLs — stable, free, no API key
        IMAGES = {
            "pizza":          "https://upload.wikimedia.org/wikipedia/commons/a/a3/Eq_it-na_pizza-margherita_sep2005_sml.jpg",
            "sushi":          "https://upload.wikimedia.org/wikipedia/commons/6/60/Sushi_platter.jpg",
            "steak":          "https://upload.wikimedia.org/wikipedia/commons/2/2e/Beef_steak_2.jpg",
            "ice_cream":      "https://upload.wikimedia.org/wikipedia/commons/2/2e/Ice_cream_with_whipped_cream%2C_chocolate_syrup%2C_and_a_wafer_%28cropped%29.jpg",
            "tacos":          "https://upload.wikimedia.org/wikipedia/commons/7/73/001_Tacos_de_carnitas%2C_Abasto_market%2C_Mexico_City.jpg",
            "waffles":        "https://upload.wikimedia.org/wikipedia/commons/3/3c/Waffles_with_Strawberries.jpg",
            "donuts":         "https://upload.wikimedia.org/wikipedia/commons/a/a5/Glazed-Donut.jpg",
            "hot_dog":        "https://upload.wikimedia.org/wikipedia/commons/f/fb/Hotdog_-_Evan_Swigart.jpg",
            "fried_rice":     "https://upload.wikimedia.org/wikipedia/commons/2/22/Fried_rice_-_lower_res.jpg",
            "chocolate_cake": "https://upload.wikimedia.org/wikipedia/commons/4/4b/Chocolate_Cake_Flourless_%281%29.jpg",
            "caesar_salad":   "https://upload.wikimedia.org/wikipedia/commons/3/3f/Caesar_salad_%281%29.jpg",
            "chicken_wings":  "https://upload.wikimedia.org/wikipedia/commons/6/6a/Baked_Chicken_Wings.jpg",
            "dumplings":      "https://upload.wikimedia.org/wikipedia/commons/9/91/Dim_sum_at_Yank_Sing.jpg",
            "eggs_benedict":  "https://upload.wikimedia.org/wikipedia/commons/2/29/Eggs_Benedict.jpg",
            "hamburger":      "https://upload.wikimedia.org/wikipedia/commons/4/4d/Hamburger_-_499700723.jpg",
            "clam_chowder":   "https://upload.wikimedia.org/wikipedia/commons/0/04/Clam_chowder.jpg",
            "ramen":          "https://upload.wikimedia.org/wikipedia/commons/e/e3/Shoyu_Ramen.jpg",
            "french_fries":   "https://upload.wikimedia.org/wikipedia/commons/f/f8/Potato-Chips.jpg",
            "grilled_salmon": "https://upload.wikimedia.org/wikipedia/commons/9/90/Grilled_Salmon.jpg",
            "pancakes":       "https://upload.wikimedia.org/wikipedia/commons/0/04/Pancakes_with_strawberries.jpg",
        }

        saved = 0
        total = len(IMAGES)

        for category, url in IMAGES.items():
            dst = f"{SAVE_DIR}/{category}.jpg"
            try:
                resp = requests.get(url, timeout=30, allow_redirects=True,
                                    headers={"User-Agent": "Mozilla/5.0"})
                resp.raise_for_status()

                img = Image.open(BytesIO(resp.content)).convert("RGB")
                img.save(dst, "JPEG", quality=95)

                saved += 1
                w, h = img.size
                print(f"[{saved:02d}/{total}] saved {dst}  {w}x{h}  ({len(resp.content)//1024}KB)")
            except Exception as e:
                print(f"[WARN] failed {category}: {e}")

            time.sleep(0.3)

        print("=" * 60)
        print(f"Done. {saved}/{total} images saved to {SAVE_DIR}")
        print("=" * 60)
        EOF

  # ─────────────────────────────────────────────
  # AG News text corpus loader
  # 4 categories x 10,000 records = 40,000 total
  # Step 1: Save flat string array per category file
  # Step 2: Combine into single corpus.json
  #         filename = title, string = description
  # Saved to corpus_data volume
  # ─────────────────────────────────────────────
  text_loader:
    image: python:3.14-slim-bookworm
    container_name: text_loader
    networks:
      - qnmesh
    volumes:
      - corpus_data:/data/corpus
    restart: "no"
    command:
      - bash
      - -c
      - |
        pip install datasets --quiet
        python - <<'EOF'
        import os, json
        from datasets import load_dataset

        SAVE_DIR    = "/data/corpus"
        MAX_PER_CAT = 10000

        os.makedirs(SAVE_DIR, exist_ok=True)

        CATEGORY_MAP = {
            0: "world",
            1: "sports",
            2: "business",
            3: "technology",
        }

        # ── Step 1: flat string array per category ────────────────────
        print("[INFO] Loading AG News dataset...")
        dataset = load_dataset("ag_news", split="train")
        print(f"[INFO] Dataset loaded — {len(dataset)} total records")

        corpus = {cat: [] for cat in CATEGORY_MAP.values()}

        for row in dataset:
            label    = row["label"]
            category = CATEGORY_MAP.get(label)
            if category is None:
                continue
            if len(corpus[category]) >= MAX_PER_CAT:
                continue
            corpus[category].append(row["text"].strip())
            if all(len(v) >= MAX_PER_CAT for v in corpus.values()):
                break

        total = 0
        for category, records in corpus.items():
            fpath = f"{SAVE_DIR}/{category}.json"
            with open(fpath, "w", encoding="utf-8") as f:
                json.dump(records, f, ensure_ascii=False, indent=2)
            total += len(records)
            print(f"[INFO] {category:12s} → {len(records):6d} records → {fpath}")
            if records:
                print(f"       sample: {records[0][:80]}")

        print(f"[INFO] Step 1 done — {total} total records")

        # ── Step 2: combine into single corpus.json ───────────────────
        print("[INFO] Building corpus.json ...")

        combined = []
        for fname in sorted(os.listdir(SAVE_DIR)):
            if not fname.endswith(".json") or fname == "corpus.json":
                continue
            title = fname.replace(".json", "")
            with open(f"{SAVE_DIR}/{fname}", "r", encoding="utf-8") as f:
                entries = json.load(f)
            for description in entries:
                combined.append({"title": title, "description": description})
            print(f"[INFO] {title:12s} → {len(entries)} entries added")

        with open(f"{SAVE_DIR}/corpus.json", "w", encoding="utf-8") as f:
            json.dump(combined, f, ensure_ascii=False, indent=2)

        print("=" * 60)
        print(f"Done. corpus.json → {len(combined)} total records")
        print(f"sample: {json.dumps(combined[0], ensure_ascii=False)[:120]}")
        print("=" * 60)
        EOF
