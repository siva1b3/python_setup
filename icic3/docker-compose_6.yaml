name: ztrelay-api

services:
  api:
    image: python:3.14-slim-bookworm
    container_name: oneshot-django
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ztrelay-api
      APP_VERSION: 1.0.0
      PYTHONUNBUFFERED: "1"
    command:
      - bash
      - -c
      - |
        pip install django --quiet

        python - <<'EOF'

        import os
        from datetime import datetime, timezone

        from django.conf import settings
        from django.core.management import execute_from_command_line
        from django.http import JsonResponse, HttpResponse
        from django.urls import path


        APP_NAME    = os.environ.get("APP_NAME", "app")
        APP_VERSION = os.environ.get("APP_VERSION", "0.0.1")


        def json_response(data, status=200):
            return JsonResponse(
                data,
                status=status,
                json_dumps_params={"indent": 2},
            )


        def home(request):
            return json_response({
                "service": APP_NAME,
                "version": APP_VERSION,
                "status": "running",
                "timestamp": datetime.now(timezone.utc).isoformat(),
                "routes": [
                    "/",
                    "/health",
                    "/ready",
                    "/live",
                    "/info",
                    "/metrics",
                    "/echo?msg=hello",
                ]
            })


        def health(request):
            return json_response({
                "status": "ok"
            })


        def ready(request):
            return json_response({
                "ready": True
            })


        def live(request):
            return json_response({
                "alive": True
            })


        def info(request):
            return json_response({
                "service": APP_NAME,
                "version": APP_VERSION,
                "python_version": os.sys.version,
                "timestamp": datetime.now(timezone.utc).isoformat(),
            })


        def metrics(request):
            body = "\n".join([
                "# fake metrics",
                "requests_total 42",
                "errors_total 0",
                "uptime_seconds 1234",
            ])

            return HttpResponse(
                body,
                content_type="text/plain",
            )


        def echo(request):
            msg = request.GET.get("msg", "")

            return json_response({
                "echo": msg
            })


        settings.configure(
            DEBUG=False,
            SECRET_KEY="dev-secret",
            ROOT_URLCONF=__name__,
            ALLOWED_HOSTS=["*"],
            MIDDLEWARE=[],
            INSTALLED_APPS=[],
        )


        urlpatterns = [
            path("", home),
            path("health", health),
            path("ready", ready),
            path("live", live),
            path("info", info),
            path("metrics", metrics),
            path("echo", echo),
        ]


        print("=" * 70, flush=True)
        print(f"starting {APP_NAME}:{APP_VERSION}", flush=True)
        print("listening on 0.0.0.0:8000", flush=True)
        print("=" * 70, flush=True)


        execute_from_command_line([
            "app",
            "runserver",
            "0.0.0.0:8000",
            "--noreload",
        ])

        EOF
