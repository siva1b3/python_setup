name: etl-pipeline-consumer

networks:
    etl-network:
        name: etl-network
        external: true

volumes:
    images-data:
        external: true

services:

    # ─── Consumer — Kafka → Cassandra + HDFS + Elasticsearch ────────────────────
    etl-consumer:
        image: python:3.14-slim-bookworm
        container_name: etl-consumer
        networks:
            - etl-network
        restart: unless-stopped
        volumes:
            - images-data:/data/images:ro
        environment:
            KAFKA_BROKER: etl-kafka:9092
            TEXT_TOPIC: text-events
            IMAGE_TOPIC: image-events
            CONSUMER_GROUP: etl-consumer-group
            CASSANDRA_HOST: etl-cassandra
            CASSANDRA_PORT: "9042"
            CASSANDRA_KEYSPACE: etl
            CASSANDRA_DC: dc1
            HDFS_URL: http://etl-namenode:9870
            HDFS_IMAGES_PATH: /etl/images
            ES_URL: http://etl-elasticsearch:9200
            ES_INDEX: text-events
            STATS_INTERVAL: "30"
            PYTHONUNBUFFERED: "1"
        command:
            - bash
            - -c
            - |
              pip install confluent-kafka cassandra-driver hdfs elasticsearch --quiet
              python - <<'EOF'
              import os, json, signal, sys, time
              from pathlib import Path
              from datetime import datetime, timezone
              from confluent_kafka import Consumer, KafkaError, Producer
              from cassandra.cluster import Cluster
              from cassandra.policies import DCAwareRoundRobinPolicy
              from cassandra.query import ConsistencyLevel
              from hdfs import InsecureClient
              from elasticsearch import Elasticsearch

              # ─── Config ─────────────────────────────────────────────────────────
              BROKER         = os.environ["KAFKA_BROKER"]
              TEXT_TOPIC     = os.environ["TEXT_TOPIC"]
              IMAGE_TOPIC    = os.environ["IMAGE_TOPIC"]
              CONSUMER_GROUP = os.environ["CONSUMER_GROUP"]
              CASS_HOST      = os.environ["CASSANDRA_HOST"]
              CASS_PORT      = int(os.environ["CASSANDRA_PORT"])
              KEYSPACE       = os.environ["CASSANDRA_KEYSPACE"]
              LOCAL_DC       = os.environ["CASSANDRA_DC"]
              HDFS_URL       = os.environ["HDFS_URL"]
              HDFS_IMG_PATH  = os.environ["HDFS_IMAGES_PATH"]
              ES_URL         = os.environ["ES_URL"]
              ES_INDEX       = os.environ["ES_INDEX"]
              STATS_INTERVAL = int(os.environ.get("STATS_INTERVAL", "30"))

              # ─── Logger ─────────────────────────────────────────────────────────
              def log(level, tag, msg):
                  ts = datetime.now(timezone.utc).strftime("%H:%M:%S.%f")[:-3]
                  print(f"[{ts}] [{level:5s}] [{tag:9s}] {msg}", flush=True)

              # ─── Banner ─────────────────────────────────────────────────────────
              log("INFO", "BOOT", "=" * 70)
              log("INFO", "BOOT", "ETL Consumer starting")
              log("INFO", "BOOT", f"kafka_broker     = {BROKER}")
              log("INFO", "BOOT", f"text_topic       = {TEXT_TOPIC}")
              log("INFO", "BOOT", f"image_topic      = {IMAGE_TOPIC}")
              log("INFO", "BOOT", f"consumer_group   = {CONSUMER_GROUP}")
              log("INFO", "BOOT", f"cassandra_host   = {CASS_HOST}:{CASS_PORT}")
              log("INFO", "BOOT", f"cassandra_ks     = {KEYSPACE}")
              log("INFO", "BOOT", f"cassandra_dc     = {LOCAL_DC}")
              log("INFO", "BOOT", f"hdfs_url         = {HDFS_URL}")
              log("INFO", "BOOT", f"hdfs_images_path = {HDFS_IMG_PATH}")
              log("INFO", "BOOT", f"es_url           = {ES_URL}")
              log("INFO", "BOOT", f"es_index         = {ES_INDEX}")
              log("INFO", "BOOT", f"stats_interval   = {STATS_INTERVAL}s")
              log("INFO", "BOOT", "=" * 70)

              # ─── Connect: Cassandra ──────────────────────────────────────────────
              def connect_cassandra(retries=15, delay=10):
                  log("INFO", "CASS", f"connecting to {CASS_HOST}:{CASS_PORT} (keyspace={KEYSPACE})")
                  for attempt in range(1, retries + 1):
                      try:
                          log("INFO", "CASS", f"attempt {attempt}/{retries}")
                          cluster = Cluster(
                              [CASS_HOST],
                              port=CASS_PORT,
                              load_balancing_policy=DCAwareRoundRobinPolicy(local_dc=LOCAL_DC),
                              protocol_version=5,
                              connect_timeout=10,
                          )
                          session = cluster.connect(KEYSPACE)
                          session.default_consistency_level = ConsistencyLevel.LOCAL_ONE
                          row = session.execute("SELECT now() FROM system.local").one()
                          log("INFO", "CASS", f"round-trip OK, server time = {row[0]}")
                          for tbl in ("text_events", "image_events"):
                              session.execute(f"SELECT * FROM {tbl} LIMIT 1")
                              log("INFO", "CASS", f"table verified: {KEYSPACE}.{tbl}")
                          log("INFO", "CASS", "READY")
                          return cluster, session
                      except Exception as e:
                          log("ERROR", "CASS", f"attempt {attempt} failed: {type(e).__name__}: {e}")
                          if attempt < retries:
                              log("INFO", "CASS", f"sleeping {delay}s before retry")
                              time.sleep(delay)
                  log("FATAL", "CASS", "exhausted all retries — exiting")
                  sys.exit(1)

              # ─── Connect: Kafka ──────────────────────────────────────────────────
              def connect_kafka(retries=10, delay=6):
                  log("INFO", "KAFKA", f"verifying broker reachability: {BROKER}")
                  for attempt in range(1, retries + 1):
                      try:
                          log("INFO", "KAFKA", f"attempt {attempt}/{retries}")
                          probe = Producer({"bootstrap.servers": BROKER, "socket.timeout.ms": 5000})
                          meta  = probe.list_topics(timeout=5)
                          brokers = list(meta.brokers.values())
                          topics  = list(meta.topics.keys())
                          log("INFO", "KAFKA", f"broker metadata OK — brokers={len(brokers)} topics={topics}")
                          for required in (TEXT_TOPIC, IMAGE_TOPIC):
                              if required not in meta.topics:
                                  raise RuntimeError(f"required topic missing: {required}")
                              log("INFO", "KAFKA", f"topic verified: {required}")
                          del probe
                          log("INFO", "KAFKA", "READY")
                          return
                      except Exception as e:
                          log("ERROR", "KAFKA", f"attempt {attempt} failed: {type(e).__name__}: {e}")
                          if attempt < retries:
                              log("INFO", "KAFKA", f"sleeping {delay}s before retry")
                              time.sleep(delay)
                  log("FATAL", "KAFKA", "exhausted all retries — exiting")
                  sys.exit(1)

              # ─── Connect: HDFS ───────────────────────────────────────────────────
              def connect_hdfs(retries=15, delay=10):
                  log("INFO", "HDFS", f"connecting to {HDFS_URL}")
                  for attempt in range(1, retries + 1):
                      try:
                          log("INFO", "HDFS", f"attempt {attempt}/{retries}")
                          client = InsecureClient(HDFS_URL, user="root")
                          entries = client.list("/")
                          log("INFO", "HDFS", f"root listing OK — entries={entries}")
                          client.makedirs(HDFS_IMG_PATH)
                          log("INFO", "HDFS", f"target path confirmed: {HDFS_IMG_PATH}")
                          probe_path = f"{HDFS_IMG_PATH}/.probe"
                          with client.write(probe_path, overwrite=True) as f:
                              f.write(b"probe")
                          client.delete(probe_path)
                          log("INFO", "HDFS", "write probe OK — DataNode is writable")
                          log("INFO", "HDFS", "READY")
                          return client
                      except Exception as e:
                          log("ERROR", "HDFS", f"attempt {attempt} failed: {type(e).__name__}: {e}")
                          if attempt < retries:
                              log("INFO", "HDFS", f"sleeping {delay}s before retry")
                              time.sleep(delay)
                  log("FATAL", "HDFS", "exhausted all retries — exiting")
                  sys.exit(1)

              # ─── Connect: Elasticsearch ──────────────────────────────────────────
              def connect_elasticsearch(retries=15, delay=10):
                  log("INFO", "ES", f"connecting to {ES_URL}")
                  for attempt in range(1, retries + 1):
                      try:
                          log("INFO", "ES", f"attempt {attempt}/{retries}")
                          client = Elasticsearch(ES_URL)
                          info = client.info()
                          log("INFO", "ES", f"connected — cluster={info['cluster_name']} version={info['version']['number']}")
                          health = client.cluster.health()
                          log("INFO", "ES", f"cluster health = {health['status']}")
                          if not client.indices.exists(index=ES_INDEX):
                              client.indices.create(index=ES_INDEX, body={
                                  "mappings": {
                                      "properties": {
                                          "event_id":   {"type": "keyword"},
                                          "event_time": {"type": "date"},
                                          "source":     {"type": "keyword"},
                                          "language":   {"type": "keyword"},
                                          "category":   {"type": "keyword"},
                                          "title":      {"type": "text"},
                                          "content":    {"type": "text"},
                                          "word_count": {"type": "integer"},
                                          "tags":       {"type": "keyword"},
                                          "ingested_at":{"type": "date"},
                                      }
                                  }
                              })
                              log("INFO", "ES", f"index created: {ES_INDEX}")
                          else:
                              log("INFO", "ES", f"index already exists: {ES_INDEX}")
                          log("INFO", "ES", "READY")
                          return client
                      except Exception as e:
                          log("ERROR", "ES", f"attempt {attempt} failed: {type(e).__name__}: {e}")
                          if attempt < retries:
                              log("INFO", "ES", f"sleeping {delay}s before retry")
                              time.sleep(delay)
                  log("FATAL", "ES", "exhausted all retries — exiting")
                  sys.exit(1)

              # ─── Establish all connections ───────────────────────────────────────
              log("INFO", "BOOT", "--- phase 1: Cassandra ---")
              cluster, session = connect_cassandra()

              log("INFO", "BOOT", "--- phase 2: Kafka ---")
              connect_kafka()

              log("INFO", "BOOT", "--- phase 3: HDFS ---")
              hdfs_client = connect_hdfs()

              log("INFO", "BOOT", "--- phase 4: Elasticsearch ---")
              es_client = connect_elasticsearch()

              log("INFO", "BOOT", "all connections established — proceeding to consume")
              log("INFO", "BOOT", "=" * 70)

              # ─── Prepared statements ────────────────────────────────────────────
              log("INFO", "CASS", "preparing INSERT statements")
              insert_text = session.prepare("""
                  INSERT INTO text_events
                    (event_id, event_time, source, language, category,
                     title, content, word_count, tags, ingested_at)
                  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              """)
              insert_image = session.prepare("""
                  INSERT INTO image_events
                    (event_id, event_time, source, image_id, file_path,
                     format, size_bytes, lat, lon, tags, ingested_at)
                  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              """)
              log("INFO", "CASS", "prepared statements ready: insert_text, insert_image")

              # ─── Kafka consumer ─────────────────────────────────────────────────
              log("INFO", "KAFKA", f"creating consumer (group={CONSUMER_GROUP})")
              consumer = Consumer({
                  "bootstrap.servers":     BROKER,
                  "group.id":              CONSUMER_GROUP,
                  "auto.offset.reset":     "earliest",
                  "enable.auto.commit":    False,
                  "session.timeout.ms":    45000,
                  "max.poll.interval.ms":  300000,
                  "client.id":             "etl-consumer",
              })

              # ─── Rebalance callbacks ────────────────────────────────────────────
              def on_assign(c, partitions):
                  log("INFO", "REBAL", f"partitions ASSIGNED ({len(partitions)}):")
                  for p in partitions:
                      log("INFO", "REBAL", f"  -> topic={p.topic} partition={p.partition} offset={p.offset}")
                  log("INFO", "KAFKA", "READY — joined group, will start receiving messages")

              def on_revoke(c, partitions):
                  log("WARN", "REBAL", f"partitions REVOKED ({len(partitions)}):")
                  for p in partitions:
                      log("WARN", "REBAL", f"  -> topic={p.topic} partition={p.partition}")

              consumer.subscribe([TEXT_TOPIC, IMAGE_TOPIC], on_assign=on_assign, on_revoke=on_revoke)
              log("INFO", "KAFKA", f"subscribed to topics: [{TEXT_TOPIC}, {IMAGE_TOPIC}] — waiting for partition assignment...")

              # ─── Shutdown handler ───────────────────────────────────────────────
              running = True
              def shutdown(sig, frame):
                  global running
                  log("WARN", "SIGNAL", f"signal {sig} received — initiating graceful shutdown")
                  running = False

              signal.signal(signal.SIGTERM, shutdown)
              signal.signal(signal.SIGINT,  shutdown)

              # ─── Helpers ────────────────────────────────────────────────────────
              def parse_ts(s):
                  return datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)

              def write_text(event):
                  session.execute(insert_text, (
                      event["event_id"],
                      parse_ts(event["timestamp"]),
                      event.get("source"),
                      event.get("language"),
                      event.get("category"),
                      event.get("title"),
                      event.get("content"),
                      event.get("word_count"),
                      set(event.get("tags", [])) or None,
                      datetime.now(timezone.utc),
                  ))

              def index_text(event):
                  es_client.index(
                      index=ES_INDEX,
                      id=event["event_id"],
                      document={
                          "event_id":   event["event_id"],
                          "event_time": event["timestamp"],
                          "source":     event.get("source"),
                          "language":   event.get("language"),
                          "category":   event.get("category"),
                          "title":      event.get("title"),
                          "content":    event.get("content"),
                          "word_count": event.get("word_count"),
                          "tags":       event.get("tags", []),
                          "ingested_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      }
                  )

              def upload_to_hdfs(event):
                  src = Path(event.get("file_path", ""))
                  if not src.exists():
                      log("WARN", "HDFS", f"source not found: {src} — skipping upload")
                      return None
                  hdfs_dest = f"{HDFS_IMG_PATH}/{src.name}"
                  with open(src, "rb") as f:
                      hdfs_client.write(hdfs_dest, f, overwrite=True)
                  return hdfs_dest

              def write_image(event):
                  loc = event.get("location", {}) or {}
                  session.execute(insert_image, (
                      event["event_id"],
                      parse_ts(event["timestamp"]),
                      event.get("source"),
                      event.get("image_id"),
                      event.get("file_path"),
                      event.get("format"),
                      event.get("size_bytes"),
                      loc.get("lat"),
                      loc.get("lon"),
                      set(event.get("tags", [])) or None,
                      datetime.now(timezone.utc),
                  ))

              # ─── Main loop ──────────────────────────────────────────────────────
              log("INFO", "MAIN", "entering poll loop")

              stats = {"text": 0, "image": 0, "hdfs_ok": 0, "hdfs_skip": 0, "es_ok": 0, "parse_err": 0, "write_err": 0}
              last_report = time.time()
              first_message_seen = False

              try:
                  while running:
                      msg = consumer.poll(timeout=1.0)

                      if time.time() - last_report > STATS_INTERVAL:
                          log("INFO", "STATS",
                              f"text={stats['text']} "
                              f"image={stats['image']} "
                              f"hdfs_ok={stats['hdfs_ok']} "
                              f"hdfs_skip={stats['hdfs_skip']} "
                              f"es_ok={stats['es_ok']} "
                              f"parse_err={stats['parse_err']} "
                              f"write_err={stats['write_err']} "
                              f"total={stats['text']+stats['image']}")
                          last_report = time.time()

                      if msg is None:
                          continue

                      if msg.error():
                          if msg.error().code() != KafkaError._PARTITION_EOF:
                              log("ERROR", "KAFKA", f"poll error: {msg.error()}")
                          continue

                      if not first_message_seen:
                          log("INFO", "MAIN", "first message received — pipeline is flowing")
                          first_message_seen = True

                      topic     = msg.topic()
                      partition = msg.partition()
                      offset    = msg.offset()
                      key       = msg.key().decode() if msg.key() else None
                      size      = len(msg.value()) if msg.value() else 0

                      log("INFO", "RECV",
                          f"topic={topic} partition={partition} offset={offset} key={key} size={size}B")

                      try:
                          event = json.loads(msg.value().decode("utf-8"))
                      except json.JSONDecodeError as e:
                          log("ERROR", "PARSE",
                              f"invalid JSON at offset={offset} partition={partition}: {e} — committing to skip")
                          consumer.commit(message=msg, asynchronous=False)
                          stats["parse_err"] += 1
                          continue

                      try:
                          if topic == TEXT_TOPIC:
                              t0 = time.monotonic()
                              write_text(event)
                              index_text(event)
                              dt_ms = (time.monotonic() - t0) * 1000
                              stats["text"] += 1
                              stats["es_ok"] += 1
                              log("INFO", "TEXT->CS",
                                  f"id={event['event_id']} "
                                  f"category={event.get('category', '?')} "
                                  f"words={event.get('word_count', '?')} "
                                  f"write={dt_ms:.1f}ms "
                                  f"[total_text={stats['text']}]")

                          elif topic == IMAGE_TOPIC:
                              t0 = time.monotonic()
                              hdfs_dest = upload_to_hdfs(event)
                              if hdfs_dest:
                                  stats["hdfs_ok"] += 1
                                  log("INFO", "HDFS",
                                      f"id={event['event_id']} "
                                      f"src={event.get('file_path')} "
                                      f"dest={hdfs_dest}")
                              else:
                                  stats["hdfs_skip"] += 1
                              write_image(event)
                              dt_ms = (time.monotonic() - t0) * 1000
                              stats["image"] += 1
                              log("INFO", "IMG->CS",
                                  f"id={event['event_id']} "
                                  f"file={event.get('image_id', '?')} "
                                  f"src={event.get('source', '?')} "
                                  f"write={dt_ms:.1f}ms "
                                  f"[total_image={stats['image']}]")

                          else:
                              log("WARN", "SKIP", f"unknown topic: {topic}")

                          consumer.commit(message=msg, asynchronous=False)
                          log("INFO", "COMMIT",
                              f"offset committed: topic={topic} partition={partition} offset={offset}")

                      except Exception as e:
                          stats["write_err"] += 1
                          log("ERROR", "WRITE",
                              f"failed event_id={event.get('event_id')} topic={topic} "
                              f"err={type(e).__name__}: {e} — NOT committing, will retry")
                          time.sleep(1)

              finally:
                  log("INFO", "SHUTDN", "=" * 70)
                  log("INFO", "SHUTDN",
                      f"final stats — text={stats['text']} image={stats['image']} "
                      f"hdfs_ok={stats['hdfs_ok']} hdfs_skip={stats['hdfs_skip']} "
                      f"es_ok={stats['es_ok']} "
                      f"parse_err={stats['parse_err']} write_err={stats['write_err']}")
                  log("INFO", "SHUTDN", "closing Kafka consumer")
                  consumer.close()
                  log("INFO", "SHUTDN", "shutting down Cassandra cluster connection")
                  cluster.shutdown()
                  log("INFO", "SHUTDN", "clean shutdown complete")
                  log("INFO", "SHUTDN", "=" * 70)
              EOF
