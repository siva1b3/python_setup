name: etl-pipeline-producers-stream

networks:
  etl-network:
    name: etl-network
    external: true

volumes:
  images-data:
    external: true

services:

  # ─── Producer 1 — Text Events (streaming) ───────────────────────────────────
  etl-producer1:
    image: python:3.14-slim-bookworm
    container_name: etl-producer1
    networks:
      - etl-network
    restart: unless-stopped
    environment:
      KAFKA_BROKER: etl-kafka:9092
      TEXT_TOPIC: text-events
    command:
      - bash
      - -c
      - |
        pip install confluent-kafka --quiet
        python - <<'EOF'
        import os, json, time, random, signal, sys
        from confluent_kafka import Producer

        BROKER = os.environ["KAFKA_BROKER"]
        TOPIC  = os.environ["TEXT_TOPIC"]

        producer = Producer({"bootstrap.servers": BROKER})

        SOURCES    = ["news-scraper", "rss-feed", "web-crawler"]
        CATEGORIES = ["technology", "science", "politics", "sports", "health"]
        TAGS_POOL  = ["ai", "research", "climate", "election", "space", "health", "data"]

        TITLES = [
            "New AI model released by research lab",
            "Scientists discover new exoplanet",
            "Election results finalized in three states",
            "Team wins championship after decade",
            "Study links diet to cognitive performance",
            "Spacecraft completes Mars orbit insertion",
            "Open source framework reaches version 2.0",
            "Global temperatures hit record high",
            "New battery technology doubles EV range",
            "Researchers map complete neural connectome",
        ]

        def delivery_report(err, msg):
            if err:
                print(f"[ERROR] Delivery failed: {err}", flush=True)
            else:
                print(f"[OK] topic={msg.topic()} partition={msg.partition()} offset={msg.offset()}", flush=True)

        def shutdown(sig, frame):
            print("\n[STOP] Signal received. Flushing and exiting...", flush=True)
            producer.flush()
            sys.exit(0)

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT,  shutdown)

        counter = 0
        print("[START] Producer 1 streaming. Press Ctrl+C or docker stop to exit.", flush=True)

        while True:
            batch_size = random.randint(5, 10)
            batch_start = time.time()

            for _ in range(batch_size):
                words = random.randint(80, 400)
                event = {
                    "event_id":   f"evt-text-{counter:06d}",
                    "timestamp":  time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                    "source":     random.choice(SOURCES),
                    "language":   "en",
                    "category":   random.choice(CATEGORIES),
                    "title":      random.choice(TITLES),
                    "content":    f"Sample content for event {counter:06d}. " * (words // 10),
                    "word_count": words,
                    "tags":       random.sample(TAGS_POOL, k=random.randint(2, 4)),
                }
                producer.produce(
                    TOPIC,
                    key=event["event_id"],
                    value=json.dumps(event),
                    callback=delivery_report,
                )
                producer.poll(0)
                print(f"[TEXT] {event['event_id']}  category={event['category']}", flush=True)
                counter += 1

            elapsed = time.time() - batch_start
            sleep_time = max(0, 1.0 - elapsed)
            time.sleep(sleep_time)
        EOF

  # ─── Producer 2 — Image Events (streaming) ──────────────────────────────────
  etl-producer2:
    image: python:3.14-slim-bookworm
    container_name: etl-producer2
    networks:
      - etl-network
    volumes:
      - images-data:/data/images
    restart: unless-stopped
    environment:
      KAFKA_BROKER: etl-kafka:9092
      IMAGE_TOPIC: image-events
      IMAGE_LOCAL_PATH: /data/images
    command:
      - bash
      - -c
      - |
        pip install confluent-kafka --quiet
        python - <<'EOF'
        import os, json, time, random, signal, sys
        from pathlib import Path
        from confluent_kafka import Producer

        BROKER    = os.environ["KAFKA_BROKER"]
        TOPIC     = os.environ["IMAGE_TOPIC"]
        IMAGE_DIR = Path(os.environ["IMAGE_LOCAL_PATH"])

        producer = Producer({"bootstrap.servers": BROKER})

        SOURCES = ["satellite-feed", "drone-capture", "ground-camera"]

        images = sorted(IMAGE_DIR.glob("*.png"))
        if not images:
            raise RuntimeError(f"No images found in {IMAGE_DIR}")

        print(f"[START] Found {len(images)} images. Streaming image events.", flush=True)

        def delivery_report(err, msg):
            if err:
                print(f"[ERROR] Delivery failed: {err}", flush=True)
            else:
                print(f"[OK] topic={msg.topic()} partition={msg.partition()} offset={msg.offset()}", flush=True)

        def shutdown(sig, frame):
            print("\n[STOP] Signal received. Flushing and exiting...", flush=True)
            producer.flush()
            sys.exit(0)

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT,  shutdown)

        counter = 0
        img_count = len(images)
        print("[START] Producer 2 streaming. Press Ctrl+C or docker stop to exit.", flush=True)

        while True:
            batch_size = random.randint(5, 10)
            batch_start = time.time()

            for _ in range(batch_size):
                img_path = images[counter % img_count]
                stat = img_path.stat()
                event = {
                    "event_id":   f"evt-img-{counter:06d}",
                    "timestamp":  time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                    "source":     random.choice(SOURCES),
                    "image_id":   img_path.stem,
                    "file_path":  str(img_path),
                    "format":     img_path.suffix.lstrip(".").upper(),
                    "size_bytes": stat.st_size,
                    "location": {
                        "lat": round(random.uniform(8.0,  37.0), 4),
                        "lon": round(random.uniform(68.0, 97.0), 4),
                    },
                    "tags": random.sample(["remote-sensing", "urban", "rural", "daytime", "nighttime", "sar", "optical"], k=3),
                }
                producer.produce(
                    TOPIC,
                    key=event["event_id"],
                    value=json.dumps(event),
                    callback=delivery_report,
                )
                producer.poll(0)
                print(f"[IMG]  {event['event_id']}  file={img_path.name}", flush=True)
                counter += 1

            elapsed = time.time() - batch_start
            sleep_time = max(0, 1.0 - elapsed)
            time.sleep(sleep_time)
        EOF
