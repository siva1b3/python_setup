name: etl-pipeline-cassandra

networks:
  etl-network:
    name: etl-network
    external: true

volumes:
  cassandra-data:
    name: cassandra-data

services:

  # ─── Cassandra 5.0.7 — Single-Node Cluster ──────────────────────────────────
  etl-cassandra:
    image: cassandra:5.0.7-bookworm
    container_name: etl-cassandra
    restart: unless-stopped
    networks:
      - etl-network
    ports:
      - "9042:9042"
      - "7000:7000"
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: etl-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_BROADCAST_ADDRESS: etl-cassandra
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: etl-cassandra
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─── Cassandra Web UI ───────────────────────────────────────────────────────
  etl-cassandra-ui:
    image: ipushc/cassandra-web:v1.1.5
    container_name: etl-cassandra-ui
    restart: unless-stopped
    networks:
      - etl-network
    ports:
      - "8890:8083"
    depends_on:
      etl-cassandra:
        condition: service_healthy
    environment:
      HOST_PORT: ":8083"
      CASSANDRA_HOST: etl-cassandra
      CASSANDRA_PORT: "9042"
