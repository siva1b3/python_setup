name: etl-pipeline-elasticsearch

networks:
  etl-network:
    name: etl-network
    external: true

volumes:
  elasticsearch-data:
    name: elasticsearch-data

services:

  # ─── Elasticsearch 9.3.2 — Single-Node ──────────────────────────────────────
  etl-elasticsearch:
    image: elasticsearch:9.3.2
    container_name: etl-elasticsearch
    restart: unless-stopped
    networks:
      - etl-network
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
